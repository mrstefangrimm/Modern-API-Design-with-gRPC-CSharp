apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greet-client.fullname" . }}
  labels:
    {{- include "greet-client.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "greet-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "greet-client.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort | default .Values.service.port }}
          env:
            - name: ASPNETCORE_URLS
              value: http://+:{{ .Values.containerPort | default .Values.service.port }}
            - name: GrpcGreetServerUrl
              value: http://greetserver:{{ .Values.grpcServerPort | default 50051 }}